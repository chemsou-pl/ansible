---

- hosts: all
  become: true
  tasks:
    - name: update
      tags: always
      apt:
        update-cache: yes

- hosts: all
  become: true
  tasks:
    - name:  install unzip
      package:
        name: unzip
    - name: install terraforme
      unarchive:
        src: https://releases.hashicorp.com/terraform/0.12.28/terraform_0.12.28_linux_amd64.zip
        dest: /usr/local/bin
        remote_src: yes
        mode: 0755
        owner: root
        group: root
        
- hosts: web
  become: true
  tasks:
    - name: install apache2 package
      tags: apache, apache2
      apt:
        name: apache2
        state: latest

    - name: install php
      tags: apache, httpd
      apt:
        name: libapache2-mod-php
        state: latest
    - name: copy html files
      tags: apache, apache2
      copy:
        src: /home/ansible/ansible/files/default_site.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644
- hosts: db
  become: true
  tasks:
    - name: Install mariadb
      tags: mariadb
      apt:
        name: mariadb-server
        state: latest
- hosts: file
  become: true
  tasks:
    - name: Install Samba
      tags: samba
      apt:
        name: samba
        state: latest