      tags: always
      apt:
        update-cache: yes
- hosts: all
  become: true
  roles:
    - base
- hosts: web
  become: true
  roles:
    - web
- hosts: db
  become: true
  roles:
    - db
- hosts: file
  become: true
  roles:
    - file